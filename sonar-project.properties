# SonarQube Cloud analysis settings. The token is the SONAR_TOKEN repository
# secret on GitHub; it is never stored here.
sonar.organization=harbinnon
sonar.projectKey=Harbinnon_eve-assistant

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# Findings deliberately not acted on, each with its reason. Ignored here
# rather than in the SonarQube web page so the reasons are reviewed in pull
# requests like any other change.
sonar.issue.ignore.multicriteria=lockfile,plsql,openapi,cliexit,motion,status

# No lock file: libraries are pinned exactly (==) in pyproject.toml and
# every indirect library in constraints.txt (docs/decisions/0001-libraries.md).
sonar.issue.ignore.multicriteria.lockfile.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.lockfile.resourceKey=pyproject.toml

# The migrations are SQLite, not Oracle PL/SQL: SQLite has no
# "CREATE OR REPLACE", and each migration runs exactly once.
sonar.issue.ignore.multicriteria.plsql.ruleKey=plsql:*
sonar.issue.ignore.multicriteria.plsql.resourceKey=**/migrations/*.sql

# The dashboard turns off FastAPI's OpenAPI schema and docs pages, so there
# is no "responses" documentation to keep in step.
sonar.issue.ignore.multicriteria.openapi.ruleKey=python:S8415
sonar.issue.ignore.multicriteria.openapi.resourceKey=src/eve_assistant/web/__init__.py

# CLI commands return an exit code; commands that can only fail by raising
# always return 0, which is the convention, not a mistake.
sonar.issue.ignore.multicriteria.cliexit.ruleKey=python:S3516
sonar.issue.ignore.multicriteria.cliexit.resourceKey=src/eve_assistant/cli.py

# "!important" in the prefers-reduced-motion rule is the standard way to make
# sure no transition anywhere overrides the visitor's setting.
sonar.issue.ignore.multicriteria.motion.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.motion.resourceKey=src/eve_assistant/web/static/style.css

# The flash message is a status announcement, not the result of a
# calculation, so role="status" is the right element; <output> is not.
sonar.issue.ignore.multicriteria.status.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.status.resourceKey=src/eve_assistant/web/templates/base.html
