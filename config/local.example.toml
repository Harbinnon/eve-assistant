# Copy this file to config/local.toml (gitignored) and fill it in.
# Never put secrets here: refresh tokens and webhook URLs are entered through
# the tool's own setup prompt and stored encrypted outside the project.

[esi]
# From your application at https://developers.eveonline.com/ (see docs/setup-esi.md).
# Not a secret, but it belongs to your registration, so it stays out of git.
client_id = "<your client id>"
callback_url = "http://localhost:8765/callback"

# CCP asks API clients to send a descriptive User-Agent with a way to reach
# the operator. Use whatever contact you are happy for CCP to see.
contact = "<your EVE character name or email>"

# Planetary Interaction: tick esi-planets.manage_planets.v1 (read-only) on
# your ESI application first, then set this and log each character in again.
# Leave it out until then: EVE's login fails if the application lacks it.
# planets = true

[app]
# "local" (default) or "hosted". Hosted mode is not built yet.
mode = "local"
# Refresh from EVE in the background while the dashboard runs (default true).
# auto_refresh = false
# With auto_refresh on, load CCP's new static data (about 100 MB, once per game
# update) by itself when no play session is open (default true).
# auto_update_static_data = false

# Hosted mode only (the always-on copy on your own server, behind a reverse
# proxy that signs people in and passes their Discord ID as X-Auth-Id). Set
# mode = "hosted" under [app] and callback_url under [esi] to
# https://<hostname>/callback, then run: eve-assistant serve --hosted
# [hosted]
# hostname = "<eve.example.com>"
# listen = "0.0.0.0"            # all of the server's addresses (or just its own)
# lan_address = "<the server's own address>"   # what the log sender connects to
# proxy = "<the reverse proxy's address>"
# home_network = "<e.g. 192.168.1.0/24>"
# owner_discord_id = "<your Discord user ID>"
# port = 8700

# On the gaming PC, to send your mining lines to the hosted copy:
# eve-assistant send-logs --setup (enter the token), then send-logs [--watch 5].
# [send_logs]
# url = "<http://the hosted copy's address on your home network:8700>"

[backups]
# Where the daily database backups go. Default: var/backups next to the
# database. A folder on another drive, or one your cloud drive syncs, also
# survives a disk failure. Backups hold your game data (wallet, assets,
# history) but never login tokens.
# folder = "D:/EVE Assistant backups"

[logs]
# Optional, local mode only: EVE's game log folder, so the assistant can read
# your mining cycles (real yield per minute). Only "(mining)" lines from your
# own characters' logs are read. Leave it out to turn this off.
# gamelogs_dir = "C:/Users/<you>/Documents/EVE/logs/Gamelogs"
