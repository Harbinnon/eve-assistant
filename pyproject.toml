[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-assistant"
version = "0.1.0"
description = "Goal-driven planning assistant for EVE Online mining, industry and hauling."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# Runtime libraries are added once the library proposal
# (docs/decisions/0001-libraries.md) is approved. Pin exactly.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "pre-commit==4.6.2",
    "detect-secrets==1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works.
"tests/**" = ["S101"]
