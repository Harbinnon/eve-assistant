[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-assistant"
version = "0.16.0"
description = "Goal-driven planning assistant for EVE Online mining, industry and hauling."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# Approved in docs/decisions/0001-libraries.md. Pin exactly; transitive
# dependencies are pinned in constraints.txt.
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "pre-commit==4.7.0",
    "detect-secrets==1.5.0",
    "respx==0.23.1",
    "pip-audit==2.10.1",
    "pytest-cov==7.1.0",
]

[project.scripts]
eve-assistant = "eve_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eve_assistant.store" = ["migrations/*.sql", "market_schema.sql"]
"eve_assistant.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["real_static_data_check: run the daily static data check (mocked HTTP)"]

[tool.coverage.run]
source = ["eve_assistant"]
# Paths relative to the repository root, so SonarQube Cloud can match them.
relative_files = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; tests use fake tokens.
"tests/**" = ["S101", "S105", "S106"]
