name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -c constraints.txt -e .[dev]

      - name: Known vulnerabilities in pinned libraries
        run: pip-audit --no-deps --disable-pip -r constraints.txt --progress-spinner off

      - name: Secret scan, lint, format and file checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: python -m pytest --cov --cov-report=xml

      # SonarQube Cloud: code quality, security hotspots and coverage. The
      # token is a repository secret, which GitHub does not give to runs
      # from forks or Dependabot, so the step is skipped there.
      - name: SonarQube Cloud
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
