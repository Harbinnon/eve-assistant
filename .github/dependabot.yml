# Dependabot opens pull requests for outdated or vulnerable dependencies.
# The cooldown keeps the project's rule of only using releases at least two
# weeks old (security fixes are not delayed by it). Pull requests still need
# the owner's review, and constraints.txt must be regenerated alongside.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
